<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <clipPath id="clip"><rect x="0" y="0" width="860" height="260" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="860" height="260" fill="url(#bg)"/>

    <!-- animated glowing orbs behind the glass -->
    <circle cx="150" cy="70" r="70" fill="#22d3ee" opacity="0.55" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0,0;120,60;0,0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="200" r="80" fill="#a78bfa" opacity="0.55" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0,0;-100,-70;0,0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="730" cy="80" r="70" fill="#f472b6" opacity="0.5" filter="url(#blur)">
      <animateTransform attributeName="transform" type="translate" values="0,0;-90,80;0,0" dur="10s" repeatCount="indefinite"/>
    </circle>

    <!-- frosted glass panel -->
    <rect x="30" y="30" width="800" height="200" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>
    <rect x="31" y="31" width="798" height="60" rx="21" fill="#ffffff" opacity="0.05"/>

    <!-- text -->
    <text x="430" y="105" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="url(#accent)">
      AMAN UMRAO
      <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="430" y="145" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#e2e8f0">
      Full Stack (MERN) Developer  •  C++ &amp; DSA  •  Cyber Security Enthusiast
    </text>
    <text x="430" y="178" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">
      B.Tech CSE @ ABES Engineering College  |  Ghaziabad, India
    </text>
    <rect x="330" y="198" width="200" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="width" values="40;200;40" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x" values="410;330;410" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
